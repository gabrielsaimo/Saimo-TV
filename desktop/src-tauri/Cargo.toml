[package]
name = "saimo-tv"
version = "1.8.0"
description = "SaimoTV para Windows"
authors = ["Saimo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "saimo_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "gzip", "brotli", "rustls-tls", "http2"] }
futures-util = "0.3"
percent-encoding = "2"
url = "2"

[profile.release]
# Um instalador pequeno é parte do produto: sem isto o binário sai com o dobro
# do tamanho e a diferença é só símbolo de depuração.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
