<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Saimo TV: canais ao vivo, filmes e séries — no navegador, na TV, no celular e no computador." />
    <!-- Prévia do link no WhatsApp e redes sociais. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saimo TV" />
    <meta property="og:title" content="Saimo TV" />
    <meta property="og:description" content="Canais ao vivo, filmes e séries — no navegador, na TV, no celular e no computador." />
    <meta property="og:url" content="https://saimo-tv.pages.dev/" />
    <!-- Absoluto: WhatsApp e redes sociais não resolvem caminho relativo. -->
    <meta property="og:image" content="https://saimo-tv.pages.dev/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://saimo-tv.pages.dev/icons/icon-512.png" />
    <link rel="canonical" href="https://saimo-tv.pages.dev/" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonte sem travar a primeira pintura: carrega por trás e troca quando chega. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <!-- O SDK do Chromecast só é baixado quando alguém usa o player (castService). -->
    <title>Saimo TV</title>
  </head>
  <body>
    <!-- 1. Se estiver no endereço antigo (saimo-tv.pages.dev), avisa e redireciona com os dados -->
    <script>
      (function () {
        if (location.hostname !== 'saimo-tv.pages.dev') return;

        var CHAVES = ['tv-favorites', 'tv-last-channel', 'tv-volume', 'movie-volume', 'movie-skip-time', 'current-movie-id',
          'saimo-vod-favoritos', 'saimo-continuar', 'saimo-canais-personalizados', 'saimo-ao-iniciar', 'saimo-upscaling',
          'saimo-upscale-4k', 'saimo-upscale-hd', 'saimo-buscas-recentes', 'saimo-radios-recentes', 'saimo-entrada',
          'saimo-telemetria-id'];
        var PREFIXO = 'movie-progress-';

        function montarDestino() {
          var dados = {};
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (!k) continue;
              if (CHAVES.indexOf(k) >= 0 || k.indexOf(PREFIXO) === 0) {
                var v = localStorage.getItem(k);
                if (typeof v === 'string' && v.length <= 200000) dados[k] = v;
              }
            }
          } catch (e) {}

          var hash = '';
          try {
            var raw = JSON.stringify(dados);
            if (raw && raw !== '{}') {
              var b64 = btoa(unescape(encodeURIComponent(raw)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
              hash = '#migrar=1.' + b64;
            }
          } catch (e) {}

          var path = location.pathname;
          var search = location.search;
          return 'https://saimo-tv2.pages.dev' + path + search + hash;
        }

        var destino = montarDestino();
        var segundos = 5;

        function ir() {
          location.replace(destino);
        }

        var modal = document.createElement('div');
        modal.setAttribute('role', 'alertdialog');
        modal.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0a0af2;backdrop-filter:blur(10px);font-family:Inter,system-ui,sans-serif;color:#fff;text-align:center';
        modal.innerHTML = '<div style="max-width:500px;background:#18181b;border:1px solid #7c3aed66;box-shadow:0 24px 60px rgba(0,0,0,0.85);border-radius:24px;padding:32px 24px">' +
          '<div style="width:58px;height:58px;border-radius:18px;background:#7c3aed26;border:1px solid #7c3aed66;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px">🚀</div>' +
          '<h2 style="margin:0 0 10px;font-size:24px;font-weight:700;color:#fff">O Saimo TV mudou de endereço!</h2>' +
          '<p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#d4d4d8">Para continuar assistindo com carregamento rápido, canais ao vivo e programação 100% atualizados, use o novo endereço oficial:</p>' +
          '<div style="background:#09090b;border:1px solid #27272a;border-radius:12px;padding:12px 14px;margin:0 0 20px;word-break:break-all">' +
            '<a id="migrar-link" href="' + destino + '" style="color:#a78bfa;font-weight:600;font-size:15px;text-decoration:none">https://saimo-tv2.pages.dev' + location.pathname + '</a>' +
          '</div>' +
          '<button id="migrar-agora-btn" style="width:100%;padding:14px 20px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font:700 16px inherit;cursor:pointer;margin-bottom:12px;box-shadow:0 4px 14px rgba(124,58,237,0.4)">' +
            'Ir para o novo endereço agora' +
          '</button>' +
          '<p id="migrar-contagem" style="margin:0;font-size:13px;color:#a1a1aa">Redirecionando automaticamente em <strong style="color:#fff">' + segundos + 's</strong>... (seus dados serão levados junto)</p>' +
        '</div>';

        function iniciar() {
          document.body.appendChild(modal);
          var btn = document.getElementById('migrar-agora-btn');
          if (btn) {
            btn.focus();
            btn.addEventListener('click', ir);
          }
          var link = document.getElementById('migrar-link');
          if (link) {
            link.addEventListener('click', function (e) {
              e.preventDefault();
              ir();
            });
          }
          var timer = setInterval(function () {
            segundos--;
            var contagemEl = document.getElementById('migrar-contagem');
            if (contagemEl) {
              contagemEl.innerHTML = 'Redirecionando automaticamente em <strong style="color:#fff">' + segundos + 's</strong>... (seus dados serão levados junto)';
            }
            if (segundos <= 0) {
              clearInterval(timer);
              ir();
            }
          }, 1000);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', iniciar);
        } else {
          iniciar();
        }
      })();
    </script>

    <!-- 2. Traz os dados do site antigo (favoritos, continuar assistindo, canais próprios…) que o botão do
         aviso de lá manda no trecho # do endereço. Roda antes do app, e pergunta antes de gravar. -->
    <script>
      (function () {
        var h = location.hash;
        if (h.indexOf('#migrar=1.') !== 0) return;
        function limpar() { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
        var CHAVES = ['tv-favorites', 'tv-last-channel', 'tv-volume', 'movie-volume', 'movie-skip-time', 'current-movie-id',
          'saimo-vod-favoritos', 'saimo-continuar', 'saimo-canais-personalizados', 'saimo-ao-iniciar', 'saimo-upscaling',
          'saimo-upscale-4k', 'saimo-upscale-hd', 'saimo-buscas-recentes', 'saimo-radios-recentes', 'saimo-entrada',
          'saimo-telemetria-id'];
        var PREFIXO = 'movie-progress-';
        // Nunca vem do endereço: desbloqueio adulto, caches, endereços das listas.
        var dados;
        try {
          var b = h.slice(10).replace(/-/g, '+').replace(/_/g, '/');
          while (b.length % 4) b += '=';
          dados = JSON.parse(decodeURIComponent(escape(atob(b))));
        } catch (e) { limpar(); return; }
        limpar();
        var itens = {}, n = 0;
        if (dados && typeof dados === 'object') {
          for (var k in dados) {
            if (!Object.prototype.hasOwnProperty.call(dados, k)) continue;
            var ok = CHAVES.indexOf(k) >= 0 || (k.indexOf(PREFIXO) === 0 && k.length < 80);
            var v = dados[k];
            if (ok && typeof v === 'string' && v.length <= 200000) { itens[k] = v; n++; }
          }
        }
        if (!n) return;
        function aplicar() {
          try {
            for (var k in itens) {
              var atual = localStorage.getItem(k);
              if (atual === null) { localStorage.setItem(k, itens[k]); continue; }
              // Listas (favoritos…): junta o que já tinha aqui com o que veio, sem repetir.
              try {
                var a = JSON.parse(atual), c = JSON.parse(itens[k]);
                if (Array.isArray(a) && Array.isArray(c)) {
                  var vistos = {}, juntos = [];
                  a.concat(c).forEach(function (x) { var id = JSON.stringify(x); if (!vistos[id]) { vistos[id] = 1; juntos.push(x); } });
                  localStorage.setItem(k, JSON.stringify(juntos));
                }
              } catch (e) { /* valor simples: o que já está aqui vale */ }
            }
          } catch (e) {}
        }
        var d = document.createElement('div');
        d.setAttribute('role', 'alertdialog');
        d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0a0ae6;backdrop-filter:blur(10px);font-family:Inter,system-ui,sans-serif;color:#fff;text-align:center';
        d.innerHTML = '<div style="max-width:480px;background:#18181b;border:1px solid #7c3aed66;box-shadow:0 24px 60px rgba(0,0,0,0.85);border-radius:24px;padding:32px 26px">' +
          '<div style="width:58px;height:58px;border-radius:18px;background:#7c3aed26;border:1px solid #7c3aed66;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px">📥</div>' +
          '<h2 style="margin:0 0 10px;font-size:24px;font-weight:700;color:#fff">Trazer seus dados do endereço antigo?</h2>' +
          '<p style="margin:0 0 22px;font-size:15px;line-height:1.5;color:#d4d4d8">Seus favoritos, o que você estava assistindo e seus canais próprios vão para este novo endereço.</p>' +
          '<div style="display:flex;gap:12px;justify-content:center">' +
            '<button id="migrar-sim" style="flex:1;padding:14px 20px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font:700 16px inherit;cursor:pointer;box-shadow:0 4px 14px rgba(124,58,237,0.4)">Trazer dados</button>' +
            '<button id="migrar-nao" style="flex:1;padding:14px 20px;border:1px solid #ffffff33;border-radius:12px;background:none;color:#fff;font:600 16px inherit;cursor:pointer">Agora não</button>' +
          '</div></div>';

        function exibir() {
          document.body.appendChild(d);
          var sim = document.getElementById('migrar-sim');
          if (sim) sim.focus();
          sim.addEventListener('click', function () { aplicar(); location.replace(location.pathname + location.search); });
          document.getElementById('migrar-nao').addEventListener('click', function () { d.remove(); });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', exibir);
        } else {
          exibir();
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
